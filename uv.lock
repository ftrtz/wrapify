[[package]]
name = "wrapify"
version = "0.1.0"
source = { editable = "." }

[package.optional-dependencies]
api = [
    { name = "fastapi", extra = ["standard"] },
    { name = "psycopg2-binary" },
    { name = "sqlalchemy" },
    { name = "uvicorn" },
]
etl = [
    { name = "jinja2" },
    { name = "pandas" },
    { name = "prefect", extra = ["sqlalchemy"] },
    { name = "psycopg2-binary" },
    { name = "python-dateutil" },
    { name = "spotipy" },
    { name = "sqlalchemy" },
]
web = [
    { name = "altair" },
    { name = "connectorx" },
    { name = "polars" },
    { name = "streamlit" },
]

[package.dev-dependencies]
dev = [
    { name = "notebook" },
    { name = "pytest" },
    { name = "python-dotenv" },
    { name = "ruff" },
    { name = "wrapify", extra = ["api", "etl", "web"] },
]

