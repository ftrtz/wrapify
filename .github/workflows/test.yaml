name: Run tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/etl/**'
      - 'src/api/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches:
      - main
    paths:
      - 'src/etl/**'
      - 'src/api/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run tests
        run: |
          uv run pytest tests/ -v
