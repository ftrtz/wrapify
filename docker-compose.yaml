services:
  # PostgreSQL database
  postgres:
    image: postgres:17
    container_name: wrapify-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-db_user}
      - POSTGRES_PASSWORD=${POSTGRES_SECRET:-db_password}
      - POSTGRES_DB=${DB_NAME:-spotify}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME:-spotify} -U ${POSTGRES_USER:-db_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Analytics API
  api:
    container_name: wrapify-api
    image: ftrtz/wrapify-api:latest
    # Uncomment these lines to build the image locally
#    build:
#      context: .
#      dockerfile: docker/api.Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-db_user}
      - POSTGRES_SECRET=${POSTGRES_SECRET:-db_password}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-spotify}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Streamlit Dashboard
  web:
    container_name: wrapify-dashboard
    image: ftrtz/wrapify-dashboard:latest
    # Uncomment these lines to build the image locally
#    build:
#      context: .
#      dockerfile: docker/web.Dockerfile
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-db_user}
      - POSTGRES_SECRET=${POSTGRES_SECRET:-db_password}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-spotify}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ETL Service (Prefect flows in serve mode)
  etl:
    container_name: wrapify-etl
    image: ftrtz/wrapify-etl:latest
    # Uncomment these lines to build the image locally
#    build:
#      context: .
#      dockerfile: docker/etl.Dockerfile
    ports:
      - "${ETL_HEALTH_PORT:-8080}:8080"
    environment:
      - PREFECT_API_URL=${PREFECT_API_URL:-http://your-prefect-server/api}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
