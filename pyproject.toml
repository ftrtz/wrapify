[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapify"
version = "0.1.0"
description = "Spotify listening analytics platform with ETL pipeline, API and dashboard"
readme = "README.md"
requires-python = ">=3.13"
# Shared by every service. Keep this list minimal - anything added here lands in
# all three images.
dependencies = []

# Per-service dependency sets. Each Docker image installs exactly one extra
# (`uv sync --extra etl`), so the images stay disjoint instead of identical.
[project.optional-dependencies]
etl = [
    "pandas>=3.1.0",
    "spotipy>=2.26.0",
    "sqlalchemy>=2.1.6",
    "psycopg2-binary>=2.9.13",
    "prefect[sqlalchemy]>=3.9.0",
    "jinja2>=3.1.6",
    "python-dateutil>=2.9.0.post0",
]
api = [
    "fastapi[standard]>=0.150.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.6",
    "psycopg2-binary>=2.9.13",
]
web = [
    "polars>=2.0.0",
    "connectorx>=0.4.6",
    "streamlit>=1.66.1",
    "altair>=6.3.0",
]

[dependency-groups]
dev = [
    # Pull in every service's deps so a plain `uv sync` gives a full local env
    "wrapify[etl,api,web]",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "notebook>=7.6.3",
    "python-dotenv>=1.2.4",
]

[tool.prefect]
api.url = "http://prefect-server:4200/api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.setuptools.packages.find]
where = ["src"]
